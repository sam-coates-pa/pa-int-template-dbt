name: dbt-ci

on:
  pull_request:

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: dbt deps

      - run: dbt compile

      - run: dbt test
